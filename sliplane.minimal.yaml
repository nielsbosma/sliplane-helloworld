# yaml-language-server: $schema=https://sliplane.opendeploy.cloud/schema/v1.json
version: 1

app:
  name: Hello World Minimal
  description: The Hello World app with just a Postgres database and a volume. The bucket, LLM, SMTP and Bugsink demos stay switched off.
  docs: https://github.com/nielsbosma/sliplane-helloworld

server:
  minimum: starter
  recommended: starter

inputs:
  master_password:
    type: secret
    label: Master Password
    help: Signs you in to the app.
    required: true

databases:
  db:
    engine: postgres
    version: 17

volumes:
  data:
    description: The app's notes and start counter, kept across redeploys.

services:
  web:
    image: ghcr.io/nielsbosma/sliplane-helloworld:${{ release.tag }}
    public: true
    port: 3000
    healthcheck: /health
    volumes:
      - name: data
        mountPath: /data
    env:
      DATA_DIR: /data
      MASTER_PASSWORD: ${{ inputs.master_password }}
      SESSION_SECRET: ${{ secret(48) }}
      UPDATE_URL: ${{ deployment.updateUrl }}
      DATABASE_URL: ${{ databases.db.url }}

done:
  open: ${{ services.web.url }}
  message: Sign in with your master password.
